# GitHub expects this file to be named with a .yml extension and placed in the .github/workflows directory of your repository.
# This file defines a GitHub Actions workflow that will run a single job when triggered.

name: Demo 1 - Just Dummy single job

# When this code is going to run:
on: push

# List of jobs:
jobs:
  my-job-1:
    name: My first dummy job
    # The type of machine to run the job on:
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job:
    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # Step 2: Run a simple command
      - name: Run a simple command
        run: echo "Hello, this is a dummy job running on GitHub Actions!"